name =          "splade_full_repro"
title =         "Seismic reproduction on full MS MARCO SPLADE (8.8M, static)"
description =   "Reproduce published Seismic latency/recall: full collection, paper-faithful blocking (block-size 400), max summaries, no transform, no updates"
dataset =       "Splade cocondenser on MS-MARCO"
language =      "cpp"
compile-command = "cmake --build build --config Release --target build_inverted_index perf_inverted_index"
build-command = "./build/bin/build_inverted_index"
query-command = "./build/bin/perf_inverted_index"

[settings]
k =             10
n-runs =        1
build =         true
metric =        "RR@10"

[folder]
data =          "/data/scratch/vihan/sparse_datasets/data"
index =         "/data/scratch/vihan/sparse_datasets/indexes"
qrels_path =    "/data/scratch/vihan/sparse_datasets/data/qrels.dev.small.tsv"
experiment =    "."

[filename]
dataset =       "documents.bin"
queries =       "queries.bin"
groundtruth =   "groundtruth.tsv"
doc_ids =       "doc_ids.npy"
query_ids =     "queries_ids.npy"
index =         "splade_full_repro"

[indexing_parameters]
n-postings =            4000
block-size =            400     # paper-faithful blocking (~0.1*n-postings centroids per list)
centroid-fraction =     0.1
summary-energy =        0.4
knn =                   0
clustering-algorithm =  "random-kmeans"
kmeans-doc-cut =        15
kmeans-pruning-factor = 0.005
summarization =         "max"
transform =             "none"

[query]
    [query.recall_90]
    query-cut =         3
    heap-factor =       0.9

    [query.recall_91]
    query-cut =         4
    heap-factor =       0.9

    [query.recall_93]
    query-cut =         5
    heap-factor =       0.9

    [query.recall_94]
    query-cut =         8
    heap-factor =       0.9

    [query.recall_95]
    query-cut =         5
    heap-factor =       0.8

    [query.recall_97]
    query-cut =         6
    heap-factor =       0.7
