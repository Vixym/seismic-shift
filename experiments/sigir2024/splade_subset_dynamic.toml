name =          "splade_subset1M_dynamic"
title =         "Seismic dynamic-support on Splade Cocondenser MS MARCO (1M subset)"
description =   "Pipeline validation + latency/RR@10 on a 1M-doc subset with dynamic support enabled"
dataset =       "Splade cocondenser on MS-MARCO (1M subset)"
language =      "cpp"
compile-command = "cmake --build build --config Release --target build_inverted_index perf_inverted_index"
build-command = "./build/bin/build_inverted_index"
query-command = "./build/bin/perf_inverted_index"

[settings]
k =             10
n-runs =        1
build =         true
metric =        "RR@10"

[folder]
data =          "/data/scratch/vihan/sparse_datasets/subset_1M/data"
index =         "/data/scratch/vihan/sparse_datasets/subset_1M/indexes"
qrels_path =    "/data/scratch/vihan/sparse_datasets/data/qrels.dev.small.tsv"
experiment =    "."

[filename]
dataset =       "documents.bin"
queries =       "queries.bin"
groundtruth =   "groundtruth.tsv"
doc_ids =       "doc_ids.npy"
query_ids =     "queries_ids.npy"
index =         "splade_subset1M"

[indexing_parameters]
n-postings =            4000
centroid-fraction =     0.1
summary-energy =        0.4
knn =                   0
clustering-algorithm =  "random-kmeans"
kmeans-doc-cut =        15
kmeans-pruning-factor = 0.005
dynamic-support =       "true"
summarization =         "max"
transform =             "none"

[query]
    [query.recall_90]
    query-cut =         3
    heap-factor =       0.9

    [query.recall_93]
    query-cut =         5
    heap-factor =       0.9

    [query.recall_95]
    query-cut =         5
    heap-factor =       0.8

    [query.recall_97]
    query-cut =         6
    heap-factor =       0.7
